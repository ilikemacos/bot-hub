<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Hub</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ee;--muted:#8b93a7;--accent:#6ea8fe;--me:#24406e;--err:#f2555a;--ok:#4cc38a;--warn:#e5b35b}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}
aside{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px}
aside h1{font-size:18px;margin:0 8px 14px}
.bot{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px;border-radius:8px;font:inherit;cursor:pointer}
.bot:hover{background:#1e222b}.bot.active{background:#222838;color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
header b{flex:1}
.link{color:var(--muted);font-size:12px;background:none;border:0;cursor:pointer;font:inherit;font-size:12px;text-decoration:underline}
#thread{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;align-self:flex-end;background:var(--me);padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.meta{display:block;font-size:11px;margin-top:4px;color:#b8c4dd}
.meta.ok{color:var(--ok)}.meta.err{color:var(--err)}.meta.warn{color:var(--warn)}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.keybox{margin:12px 20px 0;padding:12px;border:1px dashed var(--line);border-radius:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keybox span{color:var(--muted);font-size:13px;width:100%}
form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
textarea,input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit;flex:1}
textarea{resize:none;height:44px}
.btn{background:var(--accent);color:#0b0d12;border:0;border-radius:8px;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.foot{color:var(--muted);font-size:12px;padding:0 20px 10px}
@media(max-width:640px){body{flex-direction:column}aside{width:auto;display:flex;padding:8px}aside h1{display:none}}
</style>
</head>
<body>
<aside><h1>Bot Hub</h1><div id="bots"></div></aside>
<main>
  <header><b id="title"></b><button class="link" id="chkey" type="button">change key</button></header>
  <div id="keybox" class="keybox" hidden>
    <span>Paste this bot's webhook key to start (stored only in this browser).</span>
    <input id="keyin" type="password" placeholder="Bearer … or just the key" autocomplete="off">
    <button class="btn" id="keysave" type="button">Save</button>
  </div>
  <div id="thread"></div>
  <form id="form">
    <textarea id="msg" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="btn" id="send" type="submit">Send</button>
  </form>
  <div class="foot">Replies arrive in each bot's Grok Bot app chat, not here.</div>
</main>
<script>
const BOTS=[
 {slug:"dr-eggbot",name:"dr eggbot",url:"https://api2.cursor.sh/automations/webhook/3835ed94-57bc-5874-ade7-ee245615ff4c"},
 {slug:"nr-wyne",name:"Nr. Wyne",url:"https://api2.cursor.sh/automations/webhook/a3928e01-3500-51d5-9d1e-40a9c52ad86a"},
 {slug:"nr-wrenby",name:"Nr. Wrenby",url:"https://api2.cursor.sh/automations/webhook/130d1793-ff07-50d8-89e5-9317e3df06f5"}];
const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem("bothub:"+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem("bothub:"+k,JSON.stringify(v))};
// drop leftovers from the old relay version
["settings"].forEach(k=>localStorage.removeItem("bothub:"+k));
BOTS.forEach(b=>{localStorage.removeItem("bothub:since:"+b.slug);localStorage.removeItem("bothub:unread:"+b.slug)});
let cur=BOTS[0];
const keyOf=b=>ls.get("key:"+b.slug,"");
const hist=b=>ls.get("thread:"+b.slug,[]).filter(m=>m.from!=="bot");
const fmt=ts=>new Date(ts).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

function render(){
  $("bots").innerHTML="";
  BOTS.forEach(b=>{const el=document.createElement("button");el.type="button";el.className="bot"+(b===cur?" active":"");el.textContent=b.name;el.onclick=()=>{cur=b;render()};$("bots").append(el)});
  $("title").textContent=cur.name;
  const hasKey=!!keyOf(cur);
  $("keybox").hidden=hasKey;$("chkey").hidden=!hasKey;$("keyin").value="";
  $("send").disabled=!hasKey;
  const t=$("thread");t.innerHTML="";const h=hist(cur);
  if(!h.length){const e=document.createElement("div");e.className="empty";e.textContent="No messages yet. Say hi to "+cur.name+".";t.append(e)}
  h.forEach(m=>{const d=document.createElement("div");d.className="msg";d.textContent=m.text;
    const s=document.createElement("span");s.className="meta "+(m.cls||"");s.textContent=fmt(m.ts)+(m.status?" · "+m.status:"");d.append(s);t.append(d)});
  t.scrollTop=t.scrollHeight;
}

$("keysave").onclick=()=>{const v=$("keyin").value.trim().replace(/^Bearer\s+/i,"");if(!v)return;ls.set("key:"+cur.slug,v);render();$("msg").focus()};
$("keyin").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("keysave").click()}});
$("chkey").onclick=()=>{$("keybox").hidden=false;$("keyin").focus()};

$("form").onsubmit=async ev=>{
  ev.preventDefault();const text=$("msg").value.trim(),b=cur,key=keyOf(b);if(!text||!key)return;
  const h=hist(b),m={from:"me",text,ts:Date.now(),status:"Sending…"};h.push(m);ls.set("thread:"+b.slug,h.slice(-300));$("msg").value="";render();
  try{
    const r=await fetch(b.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({id:crypto.randomUUID(),text,action:"chat"})});
    if(r.ok){m.status="Sent ✓ — reply arrives in "+b.name+"'s Grok Bot chat";m.cls="ok"}
    else if(r.status===401||r.status===403){m.status="Wrong key ("+r.status+"). Use “change key” to fix it.";m.cls="err"}
    else{m.status="Error: webhook returned HTTP "+r.status;m.cls="err"}
  }catch(e){m.status="The browser couldn't confirm delivery (network/CORS). It may still have gone through.";m.cls="warn"}
  ls.set("thread:"+b.slug,h.slice(-300));if(b===cur)render();
};
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
render();
</script>
</body>
</html>
