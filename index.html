<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Hub</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ee;--muted:#8b93a7;--accent:#6ea8fe;--me:#24406e;--err:#f2555a;--ok:#4cc38a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}
aside{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px}
aside h1{font-size:18px;margin:0 8px 14px}
.bot{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px;border-radius:8px;font:inherit;cursor:pointer}
.bot:hover{background:#1e222b}.bot.active{background:#222838;color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);visibility:hidden}.bot.unread .dot{visibility:visible}
.spacer{flex:1}
#gear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px;font:inherit;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:600}
#banner{display:none;background:#3a1d20;color:#ffb3b5;padding:10px 20px;font-size:14px;border-bottom:1px solid #5a2a2e}
#thread{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:75%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--me)}.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg .meta{display:block;font-size:11px;color:var(--muted);margin-top:4px}.msg.failed .meta{color:var(--err)}
.empty{color:var(--muted);text-align:center;margin-top:40px}
form{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
textarea,input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
textarea{resize:none;height:44px}
.btn{background:var(--accent);color:#0b0d12;border:0;border-radius:8px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(420px,90vw);padding:20px}
dialog::backdrop{background:#0008}dialog h2{margin:0 0 8px;font-size:17px}
dialog label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
.note{color:var(--muted);font-size:12px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.row .btn{padding:8px 16px}
.ghost{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
@media(max-width:640px){body{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;padding:8px}aside h1{display:none}.spacer{display:none}}
</style>
</head>
<body>
<aside>
  <h1>Bot Hub</h1>
  <div id="bots"></div>
  <div class="spacer"></div>
  <button id="gear" type="button">⚙ Settings</button>
</aside>
<main>
  <header id="title"></header>
  <div id="banner"></div>
  <div id="thread"></div>
  <form id="form">
    <textarea id="msg" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="btn" type="submit">Send</button>
  </form>
</main>
<dialog id="settings">
  <h2>Relay settings</h2>
  <label for="relay">Relay URL</label>
  <input id="relay" type="url" placeholder="https://bot-hub.your-tailnet.ts.net" autocomplete="off">
  <label for="token">Access token</label>
  <input id="token" type="password" autocomplete="off">
  <p class="note">Saved only in this browser's localStorage. The relay is reachable only on your Tailscale network.</p>
  <div class="row"><button class="ghost" type="button" id="cancel">Cancel</button><button class="btn" type="button" id="save">Save</button></div>
</dialog>
<script>
const BOTS=[{slug:"dr-eggbot",name:"dr eggbot"},{slug:"nr-wyne",name:"Nr. Wyne"},{slug:"nr-wrenby",name:"Nr. Wrenby"}];
const $=id=>document.getElementById(id);
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem("bothub:"+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem("bothub:"+k,JSON.stringify(v))};
let current=BOTS[0].slug;
const threads={},since={};
BOTS.forEach(b=>{threads[b.slug]=ls.get("thread:"+b.slug,[]);since[b.slug]=ls.get("since:"+b.slug,0)});
const cfg=()=>ls.get("settings",{relay:"",token:""});
const base=()=>cfg().relay.replace(/\/+$/,"");

function banner(t){const b=$("banner");b.textContent=t||"";b.style.display=t?"block":"none"}
function save(slug){threads[slug]=threads[slug].slice(-300);ls.set("thread:"+slug,threads[slug]);ls.set("since:"+slug,since[slug])}
const fmt=ts=>new Date(ts).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

function renderSidebar(){
  $("bots").innerHTML="";
  BOTS.forEach(b=>{const el=document.createElement("button");el.type="button";el.className="bot"+(b.slug===current?" active":"")+(ls.get("unread:"+b.slug,false)?" unread":"");
    el.innerHTML='<span class="dot"></span>';el.append(b.name);el.onclick=()=>{current=b.slug;ls.set("unread:"+b.slug,false);renderSidebar();renderThread()};$("bots").append(el)});
}
function renderThread(){
  const b=BOTS.find(x=>x.slug===current);$("title").textContent=b.name;
  const t=$("thread");t.innerHTML="";
  if(!threads[current].length){const e=document.createElement("div");e.className="empty";e.textContent="No messages yet. Say hi to "+b.name+".";t.append(e)}
  threads[current].forEach(m=>{const d=document.createElement("div");d.className="msg "+(m.from==="me"?"me":"bot")+(m.failed?" failed":"");
    d.textContent=m.text;const s=document.createElement("span");s.className="meta";s.textContent=(m.failed?"Not delivered: "+m.failed+" · ":"")+fmt(m.ts);d.append(s);t.append(d)});
  t.scrollTop=t.scrollHeight;
}

async function api(path,opts={}){
  const c=cfg();if(!c.relay||!c.token)throw new Error("setup");
  let r;
  try{r=await fetch(base()+path,{...opts,headers:{"Content-Type":"application/json","X-Access-Token":c.token,...(opts.headers||{})}})}
  catch(e){throw new Error("unreachable")}
  let j={};try{j=await r.json()}catch{}
  if(r.status===401)throw new Error("auth");
  return {ok:r.ok,status:r.status,body:j};
}
function explain(e){
  if(e.message==="setup")return "Open Settings and enter your relay URL and access token.";
  if(e.message==="unreachable")return "Can't reach the relay. Make sure this device is connected to Tailscale and the relay is running.";
  if(e.message==="auth")return "The relay rejected the access token. Check it in Settings.";
  return "Something went wrong: "+e.message;
}

$("form").onsubmit=async ev=>{
  ev.preventDefault();const text=$("msg").value.trim();if(!text)return;
  const slug=current,m={from:"me",text,ts:Date.now()};threads[slug].push(m);$("msg").value="";save(slug);renderThread();
  try{const r=await api("/send",{method:"POST",body:JSON.stringify({bot:slug,text})});
    if(!r.ok)m.failed=r.body.error||("relay error "+r.status);else banner("");
  }catch(e){m.failed=e.message==="unreachable"?"relay unreachable":e.message;banner(explain(e))}
  save(slug);if(slug===current)renderThread();
};
$("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});

async function poll(){
  if(!cfg().relay||!cfg().token){banner(explain(new Error("setup")));return}
  try{
    for(const b of BOTS){
      const r=await api("/replies?bot="+encodeURIComponent(b.slug)+"&since="+since[b.slug]);
      if(!r.ok)continue;
      const reps=(r.body.replies||[]).filter(x=>x.ts>since[b.slug]);
      if(!reps.length)continue;
      reps.forEach(x=>{threads[b.slug].push({from:"bot",text:x.text,ts:x.ts});since[b.slug]=Math.max(since[b.slug],x.ts)});
      save(b.slug);
      if(b.slug===current)renderThread();else ls.set("unread:"+b.slug,true);
    }
    banner("");renderSidebar();
  }catch(e){banner(explain(e))}
}

const dlg=$("settings");
$("gear").onclick=()=>{const c=cfg();$("relay").value=c.relay;$("token").value=c.token;dlg.showModal()};
$("cancel").onclick=()=>dlg.close();
$("save").onclick=()=>{ls.set("settings",{relay:$("relay").value.trim(),token:$("token").value.trim()});dlg.close();poll()};

renderSidebar();renderThread();
if(!cfg().relay||!cfg().token)dlg.showModal();
poll();setInterval(poll,3000);
</script>
</body>
</html>
