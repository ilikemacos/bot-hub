<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Hub</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ee;--muted:#8b93a7;--accent:#6ea8fe;--ok:#4cc38a;--err:#f2555a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:32px 20px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}
  .tab.active{border-color:var(--accent);color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;color:var(--muted);font-size:13px;margin:10px 0 4px}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit}
  textarea{min-height:110px;resize:vertical}
  button.primary{margin-top:12px;background:var(--accent);color:#0b0d12;border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.5;cursor:default}
  details summary{cursor:pointer;color:var(--muted)}
  .status{margin-top:12px;min-height:1.5em;font-size:14px}
  .status.ok{color:var(--ok)}.status.err{color:var(--err)}
  .note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Bot Hub</h1>
  <p class="sub">Send messages straight to your Grok Bot webhooks. Replies come back in each bot's Grok Bot app chat, not on this page.</p>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <details id="settings">
      <summary>Settings for <span class="botname"></span></summary>
      <label for="url">Webhook URL</label>
      <input id="url" type="url" placeholder="https://..." autocomplete="off">
      <label for="auth">Authorization (bearer token)</label>
      <input id="auth" type="password" placeholder="Bearer ... (prefix optional)" autocomplete="off">
      <label for="key">Webhook key (X-Automation-Key)</label>
      <input id="key" type="password" autocomplete="off">
      <button class="primary" id="save" type="button">Save</button>
      <p class="note">Stored only in this browser's localStorage. Nothing is saved to the repo.</p>
    </details>
  </div>

  <div class="card">
    <label for="msg">Message to <span class="botname"></span></label>
    <textarea id="msg" placeholder="Type a message..."></textarea>
    <button class="primary" id="send" type="button">Send</button>
    <div class="status" id="status"></div>
    <p class="note">Replies arrive in <span class="botname"></span>'s chat in the Grok Bot app.</p>
  </div>
</main>
<script>
const BOTS = [{slug:"dr-eggbot", name:"dr eggbot"}, {slug:"nr-wyne", name:"Nr. Wyne"}];
let current = BOTS[0];
const $ = id => document.getElementById(id);
const storeKey = s => "bothub:" + s;
const load = s => { try { return JSON.parse(localStorage.getItem(storeKey(s))) || {}; } catch { return {}; } };

function setStatus(text, cls){ const el=$("status"); el.textContent=text; el.className="status "+(cls||""); }

function select(bot){
  current = bot;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.slug === bot.slug));
  document.querySelectorAll(".botname").forEach(e => e.textContent = bot.name);
  const c = load(bot.slug);
  $("url").value = c.url || ""; $("auth").value = c.auth || ""; $("key").value = c.key || "";
  $("settings").open = !c.url;
  setStatus("");
}

BOTS.forEach(b => {
  const t = document.createElement("button");
  t.className = "tab"; t.type = "button"; t.textContent = b.name; t.dataset.slug = b.slug;
  t.onclick = () => select(b);
  $("tabs").appendChild(t);
});

$("save").onclick = () => {
  localStorage.setItem(storeKey(current.slug), JSON.stringify({url:$("url").value.trim(), auth:$("auth").value.trim(), key:$("key").value.trim()}));
  setStatus("Settings saved for " + current.name + ".", "ok");
};

$("send").onclick = async () => {
  const c = load(current.slug), text = $("msg").value.trim();
  if (!c.url || !c.auth || !c.key) { $("settings").open = true; return setStatus("Fill in and save the webhook URL, authorization, and key first.", "err"); }
  if (!text) return setStatus("Type a message first.", "err");
  const token = c.auth.replace(/^Bearer\s+/i, "");
  $("send").disabled = true; setStatus("Sending...");
  try {
    const res = await fetch(c.url, {
      method: "POST",
      headers: {"Content-Type":"application/json", "Authorization":"Bearer " + token, "X-Automation-Key": c.key},
      body: JSON.stringify({id: crypto.randomUUID(), text, action: "chat"})
    });
    if (res.ok) { setStatus("Sent to " + current.name + ". Check its Grok Bot app chat for the reply.", "ok"); $("msg").value = ""; }
    else { let body=""; try { body = (await res.text()).slice(0,200); } catch {} setStatus("Error " + res.status + " " + res.statusText + (body ? ": " + body : ""), "err"); }
  } catch (e) {
    if (e instanceof TypeError) setStatus("The browser blocked the request (most likely CORS: the webhook doesn't allow calls from this page), or the URL is unreachable.", "err");
    else setStatus("Error: " + e.message, "err");
  } finally { $("send").disabled = false; }
};

select(BOTS[0]);
</script>
</body>
</html>
